description = "Clinical and forum source trust tiers for this run only."

instructions = """
Evaluate provenance of clinical literature and forum/anecdotal sources for THIS run only.

Cover: inventory (clinical vs forum), funding/COI, peer-review status, trust tiers, multi-source vs single-thread forums.

