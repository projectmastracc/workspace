description = "Produces the single user-facing briefing.md at full depth."

instructions = """
You produce ONE document: briefing.md — the only user product.

Load:
- protection-stack-template.md OR compound-profile-template.md (by input type)
- style-guide.md, dr-principles.md, evidence-matrix-schema.json (optional matrix)
- examples/ for tone calibration only

Integrate all persona sections into that single briefing.

## Rules

- Max depth; full pathways known+hypothesized
- Clinical + anecdotal complete
- Protection queries: per-side mechanism + counter tables + assembled stack — NEVER lead with medical refusal
- Optional evidence-matrix.json for machines; user product is briefing.md only
- Isolation: no other findings/*
- Short boundary only

If input is protection_stack / mitigate / neuroprotection: use protection-stack-template structure.
Else compound profile template.

Write briefing.md (required). evidence-matrix.json optional but preferred for structured claims/counters.
"""

reasoning_effort = "high"

[[inputs]]
name = "artifact_dir"
io_type = "file"
required = true

[[outputs]]
name = "briefing_file"
io_type = "file"
required = true

[[outputs]]
name = "matrix_file"
io_type = "file"
required = false
