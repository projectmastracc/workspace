description = "Gates single-document max-depth pathway and protection-stack quality."

instructions = """
Review briefing.md (and matrix if present) only as user product quality.

## Critical / major if missing

- Not a single coherent document (or refuses to be the full answer)
- Protection/stack query lacks per-side mechanism + pathway→counter tables for major reported sides
- No full pathway inventory (known + hypothesized)
- Clinical OR forum evidence entirely missing when material
- Leads with “don’t use / no protocol / Unknown = no recommendation” when user asked for stack/protection
- Counters not tied to named pathway nodes (generic “support” only)
- Cross-package findings/* contamination
- Speculative sold as Established

## Do NOT flag as violations

- Long dense documents
- Speculative counters that are pathway-matched and labeled
- Building full stacks when joint “full protection” is Speculative
- Including hypothesized pathways clearly labeled

Verdict: approve or needs revision. Write review.md (internal only).
"""

reasoning_effort = "high"

[[inputs]]
name = "briefing_file"
io_type = "file"
required = true

[[outputs]]
name = "review_file"
io_type = "file"
required = true
